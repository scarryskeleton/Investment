# Settings applied when the app runs (locally and when deployed).
[server]
headless = true

[browser]
gatherUsageStats = false

# No [theme] section, on purpose: pinning a theme here hides Streamlit's own
# viewer-facing theme picker (Settings -> light/dark/system, in the top-right
# menu). Leaving it unset defaults new visitors to their system preference
# and lets everyone switch for themselves - see the in-app toggle in
# app.py's top bar, which does the same switch with one click instead of
# needing to find that menu.
